      # IdentityRestClient actually binds to (iam.service.url) — the real one:
      IDENTITY_SERVICE_URL: http://iam:8082
      FILE_STORAGE_SERVICE_URL: http://content:8081
      # es-sync's field-registry resolver (onified.opensearch-sync.field-registry
      # in application-local.yml) calls platform-data's internal search endpoint.
      PLATFORM_DATA_SERVICE_URL: http://platform-data:8085
      # ── OpenSearch (es-sync search indexing) ──────────────────────────────
      # In-network hostname:port — NOT the 9210 host mapping. The library's own
      # default is localhost:9200, which inside this container is nothing, so
      # this must be set explicitly. Auth is intentionally absent: the local
      # cluster runs with the security plugin disabled.
      OPENSEARCH_URL: http://opensearch:9200
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s clients to iam/content/billing-subscription
      # (JwtTokenGrpcGateway, UserAvatarGrpcGateway, DocumentGrpcGateway, EntitlementGrpcGateway).
      GRPC_SERVER_PORT: "8506"
      IDENTITY_GRPC_PORT: "8500"
      CONTENT_GRPC_PORT: "8501"
      BILLING_GRPC_PORT: "8503"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      # ── Share-link token signing (DEV ONLY) ───────────────────────────────
      # ShareTokenKeyProvider requires a non-empty PKCS8 RSA private key at boot;
      # prod/beta get this from Vault. Throwaway 2048-bit dev-only keypair, no
      # real share links are internal-gateway-verified locally so this carries no risk.
      SHARE_TOKEN_KID: "wm-share-local-dev"
      SHARE_TOKEN_SIGNING_KEY: ""
      # ── RS256 JWT verification (DEV ONLY) ─────────────────────────────────
      # rbac-library 3.2.7 verifies RS256 only (no HS256 fallback). Trust
      # iam's signing key so tokens minted by iam's login flow
      # validate on this service's protected endpoints too.
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override ─────────────────────────────────────────────────────
      # 1024m heap fits the 2g container limit once the Dockerfile's off-heap
      # caps (metaspace 384m + direct 256m + code-cache 192m + thread stacks)
      # are accounted for. Prod uses HEAP=1536m and MUST raise the memory limit
      # to >= 3Gi to match — see RUNTIME_OBSERVABILITY.md §"Memory budget".
      HEAP: "1024m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      # es-sync builds its OpenSearch client at startup — wait for the cluster
      # to report healthy so the first index call isn't a connection refusal.
      opensearch: { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8092:8092"
      - "127.0.0.1:8506:8506"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.5'
        reservations:
          memory: 1280m
          cpus: '0.5'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKFLOW  (port: 8093)           tier: 3 — workflow engine
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Home-grown workflow engine (no Camunda/Flowable). Definitions,
  #             instances, approvals, quick actions, outbox events.
  # Calls:      iam (S2S token + user lookup), master-data (lookups),
  #             platform-data (approval-actor-types search).
  # Called by:  internal-gateway (routing target).
  # If commented out: workflow runtime + admin endpoints unavailable.
  # ───────────────────────────────────────────────────────────────────────────
  workflow:
    container_name: onified-workflow
    image: onified/workflow:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/workflow/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      # workflow's actual data + full Flyway history (17 migrations) live under a
      # schema literally named "workflow" — confirmed live (0 tables and no Flyway
      # history at all under platform_workflow_service, which was a stale/unused
      # name). This is the base application.yml's own default too; only this
      # compose override had drifted from it.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=workflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      DB_SCHEMA: workflow
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: "8093"
      SPRING_FLYWAY_ENABLED: "false"
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      IDENTITY_BASE_URL: http://iam:8082
      # Separate from IDENTITY_BASE_URL above — a different workflow client reads
      # this exact name (application.yml:110), else it falls back to localhost:8081.
      IDENTITY_SERVICE_URL: http://iam:8082
      # Required so the rbac-library's AuthorityPolicyLoader bean gets created (see
      # application-local.yml comment) — without it workflow crash-loops on boot.
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      # NOTE: master-data is on 8086 (the codebase's default :8091 is wrong —
      # see architecture doc). Explicit override here.
      MDS_SERVICE_URL: http://master-data:8086
      # workflow's own client binds this from PDS_SERVICE_URL, not
      # PLATFORM_DATA_SERVICE_URL — that name is dead, app falls back to its
      # yaml default (localhost:8085), which is wrong inside this container.
      PDS_SERVICE_URL: http://platform-data:8085
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s client to billing-subscription
      # (EntitlementGrpcGateway, target key "billing-subscription-service").
      GRPC_SERVER_PORT: "8512"
      BILLING_GRPC_PORT: "8503"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      # ── RS256 JWT verification (DEV ONLY) ─────────────────────────────────
      # rbac-library 3.2.7 verifies RS256 only (no HS256 fallback). Trust
      # iam's signing key so tokens minted by iam's login flow
      # validate on this service's protected endpoints too.
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "768m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8093:8093"
      - "127.0.0.1:8512:8512"
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '0.75'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default

