    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/work-management/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
