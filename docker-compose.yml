  # ═══════════════════════════════════════════════════════════════════════════
  # GOVERNANCE  (port: 8088)         tier: 2 — AI/API governance
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       AI/API governance, consent, rate-limit policies, budget caps,
  #             breach events, model-capability + provider-contract registry.
  # Calls:      iam (token exchange, tenant metadata),
  #             billing-subscription (plan state).
  # Called by:  notification (rate-limit policy resolution), internal-gateway.
  # If commented out: notification's rate-limit lookups fall back to defaults.
  # ───────────────────────────────────────────────────────────────────────────
  governance:
    container_name: onified-governance
    image: onified/governance:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/governance/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=governance
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      # Re-enabling Flyway (was disabled in favor of Hibernate ddl-auto=update,
      # which turned out to be non-deterministic here — repeated "check constraint
      # already exists" crashes on a genuinely fresh schema, different table each
      # restart). Testing against a real migration failure instead, on a clean
      # schema (dropped 2026-08-02).
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_SCHEMA: governance
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # RedisConfig.java binds its own manual LettuceConnectionFactory to
      # ${redis.host}/${redis.port} (legacy property names, NOT spring.data.redis.*)
      # — without these, manifestCacheInvalidationListenerContainer falls back
      # to localhost:6379 and fails to start (same class of bug as the RBAC URL
      # below: real property name doesn't match what was assumed here).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      # Was missing here (confirmed via content's identical bug) — without it,
      # DefaultAuthorityPolicyLoader falls back to localhost:8082 (this
      # container's own loopback) and every live @PreAuthorize denies by default.
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      GOVERNANCE_IDENTITY_BASE_URL: http://iam:8082
      GOVERNANCE_BILLING_BASE_URL: http://billing-subscription:8084
      # GOVERNANCE_IDENTITY_BASE_URL/GOVERNANCE_BILLING_BASE_URL above don't match the
      # property names governance's own config actually binds to — these are the real ones:
      ONIFIED_USER_MANAGEMENT_URL: http://iam:8082
      ONIFIED_BILLING_BASE_URL: http://billing-subscription:8084
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # Enable Kafka listeners locally (defaults false in prod)
      KAFKA_LISTENERS_ENABLED: "true"
      # ── gRPC server (RuntimeGateService inbound) + s2s client to iam
      # (TenantParentChainGrpcGateway, target key "iam-service").
      GRPC_SERVER_PORT: "8504"
      IDENTITY_GRPC_PORT: "8500"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "512m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8504:8504"
    deploy:
      resources:
        limits:
          memory: 900m
          cpus: '0.75'
        reservations:
          memory: 512m
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICATION  (port: 8089)       tier: 2 — fan-out
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Email/SMS/WhatsApp/Push/InApp delivery. Kafka consumer on
  #             notification-service-topic (batch listener, concurrency 4).
  # Calls:      content (template attachments), iam (constraint fetch),
  #             governance (rate-limit policy), external APIs (WhatsApp,
  #             Pinnacle SMS, Firebase, SMTP).
  # Called by:  iam, work-management, workflow (via Kafka topic).
  # If commented out: notification events queue up in Kafka; emails/SMS/push
  #                   don't get delivered. Producers continue working.
  # ───────────────────────────────────────────────────────────────────────────
  notification:
    container_name: onified-notification
    image: onified/notification:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/notification/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      DB_SCHEMA: notification
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Switched to Hibernate ddl-auto=update locally — Flyway's V33 migration has a
      # genuine SQL syntax error ("syntax error at or near FROM"). No RLS in this
      # service's migrations (verified), so this is safe.
      SPRING_FLYWAY_ENABLED: "false"
      # Required, no defaults — app fails to boot without these (matches dev-env.sh's
      # bootRun-mode convention for local mail credentials).
      MAIL_USERNAME: "dev@onified.local"
      MAIL_PASSWORD: "devpass"
      MAIL_ADDRESS: "dev@onified.local"
      # Required, no defaults — FirebaseConfig is an unconditional @Bean (no feature
      # flag to disable push locally). This is a throwaway, self-generated PKCS#8 key
      # that satisfies the SDK's init-time parsing only — it cannot actually
      # authenticate with Google, so real push sends will fail at runtime, but the
      # app boots. Real push testing needs a genuine Firebase service account key.
      # Required, no defaults — S3Client is also an unconditional @Bean. Dev-only
      # placeholder values; real S3 uploads will fail at runtime, but the app boots.
      AWS_S3_BUCKET: "dev-notification-bucket"
      AWS_REGION: "ap-south-1"
      AWS_ACCESS_KEY: "dev-throwaway-access-key"
      AWS_SECRET_KEY: "dev-throwaway-secret-key"
      # Required, no defaults — same story: unconditional beans for SMS/WhatsApp
      # providers. Dev-only placeholders; real sends will fail at runtime.
      SMS_PINNACLE_URL: "https://sms.pinnacle.example.com/api"
      SMS_PINNACLE_APIKEY: "dev-throwaway-apikey"
      SMS_PINNACLE_ENTITY_ID: "dev-throwaway-entity-id"
      WHATSAPP_API_URL: "https://whatsapp.example.com/api"
      WHATSAPP_API_TOKEN: "dev-throwaway-token"
      FIREBASE_PRIVATE_KEY_ID: "dev-throwaway-key-id"
      # FIREBASE_PRIVATE_KEY intentionally NOT set here — the Dockerfile's own
      # ENTRYPOINT self-generates a fresh throwaway one at container startup
      # if it's absent. No secret value lives in any tracked file at all.
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      FILE_STORAGE_SERVICE_URL: http://content:8081
      RATE_LIMIT_GOVERNANCE_URL: http://governance:8088
      # Required, no default anywhere in notification's own yml (shared property
      # convention, same as governance's) — NotificationMeteringService needs it.
      ONIFIED_BILLING_BASE_URL: http://billing-subscription:8084
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s client to iam
      # (BootstrapCacheGrpcGateway, target key "iam-service").
      GRPC_SERVER_PORT: "8505"
      IDENTITY_GRPC_PORT: "8500"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "512m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:8505:8505"
    deploy:
      resources:
        limits:
          memory: 900m
          cpus: '0.75'
        reservations:
          memory: 512m
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # INTEGRATION  (port: 8090)        tier: 3 — external connectors
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Third-party SaaS integrations (ULIP etc.), connector registry,
  #             field mappings, sync configs. Uses Vault for API cred rotation.
  # Calls:      iam (S2S token), job-orchestration (schedule jobs),
  #             vault, external SaaS APIs.
  # Called by:  job-orchestration (callbacks), internal-gateway (routing target).
  # If commented out: external sync flows pause. Other things unaffected.
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    container_name: onified-integration
    image: onified/integration:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/integration/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=integration
      DB_SCHEMA: integration
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      # Switched to Hibernate ddl-auto=update locally — Flyway's migration set is
      # missing a table (wh_out_delivery) that a scheduled worker queries on boot.
      # No RLS in this service's migrations (verified), so this is safe.
      # NOTE: this comment predates a fix — the ddl-auto override below never
      # actually existed, so with Flyway off AND ddl-auto still "validate"
      # (application.yml's own value), Hibernate never created a single table
      # (confirmed: 0 tables in platform_integration_service). Adding the
      # override now to match what this block always intended.
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # application.yml ALSO sets the raw hibernate.hbm2ddl.auto property directly
      # (spring.jpa.properties.hibernate.hbm2ddl.auto: none) — that native property
      # takes precedence over the ddl-auto alias above and was silently winning,
      # which is the actual reason zero tables were ever created. Override it too.
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO: update
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      IDENTITY_BASE_URL: http://iam:8082
      JOB_ORCHESTRATION_BASE_URL: http://job-orchestration:8095
      # IDENTITY_BASE_URL/JOB_ORCHESTRATION_BASE_URL above don't match the property
      # names integration's own clients actually bind to — these are the real ones:
      IDENTITY_SERVICE_URL: http://iam:8082
      JOB_ORCHESTRATION_SERVICE_URL: http://job-orchestration:8095
      # Required, no default — ServiceAccountTokenProvider needs it to mint its own
      # S2S token against iam.
      IS_SERVICE_ACCOUNT_PASSWORD: "dev-throwaway-password"
      # ── ULIP (sandbox) ───────────────────────────────────────────────────────
      # Resolved via PlatformSecretProperties (platform.secrets.credentials.ULIP_*) —
      # was previously hardcoded directly in application.yml; moved here so it isn't
      # committed to source. Sandbox creds, not production.
      ULIP_USERNAME: "gdbf_technum_usr"
      ULIP_PASSWORD: "Ef?PoVqV7t"
      ULIP_BASE_URL: "https://www.ulip.dpiit.gov.in/ulip/v1.0.0"
      # ── Vault ─────────────────────────────────────────────────────────────
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s clients to content/iam/platform-data
      # (DocumentGrpcGateway, JwtTokenGrpcGateway, VerificationRecordGrpcGateway).
      GRPC_SERVER_PORT: "8507"
      CONTENT_GRPC_PORT: "8501"
      IDENTITY_GRPC_PORT: "8500"
      PLATFORM_DATA_GRPC_PORT: "8502"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      # Bumped from 512m — this service's Kafka+gRPC+RBAC-cache bean graph
      # (32 JPA repos, DLT consumer, 3 gRPC clients) OOM-killed at boot under
      # the 900m/512m tier other lighter services on this tier use fine.
      HEAP: "1g"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      vault:    { condition: service_started }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8507:8507"
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: '0.75'
        reservations:
          memory: 1g
          cpus: '0.25'
    networks:
      - default

