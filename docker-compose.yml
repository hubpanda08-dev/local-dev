# =============================================================================
# Onified — Full stack docker compose
#
# 15 platform services + 1 apps service (cargo), each as a fully self-contained
# block. No YAML anchors, no inter-service `depends_on` — comment out any
# service block and the rest keep running unchanged.
#
# Infrastructure (postgres / redis / kafka / zookeeper / vault) is pulled in
# via `include: docker-compose.local.yml` — leave that alone unless you want
# to swap infra. Each application servic  e still declares its own infra
# depends_on so it waits for postgres/redis/kafka to be HEALTHY before booting.
# =============================================================================
#
# QUICK START
# -----------------------------------------------------------------------------
#   export GITLAB_USER=<your-user> GITLAB_TOKEN=<your-token>
#   docker compose -f deployment/docker-compose.yml up -d
#
# To skip a service: comment out its ENTIRE block (from the `═══` divider
# above the service name down to the `─` divider before the next service).
# Nothing else needs to change — there are no inter-service depends_on.
#
# To run only ONE service + infra:
#   docker compose -f deployment/docker-compose.yml up -d iam
# (Compose will start postgres/redis/kafka/vault automatically via the
# include + the service's own depends_on.)
#
# COMMENT-OUT SAFETY MAP
# -----------------------------------------------------------------------------
# Disabling these has WIDE blast radius (other services calling them error out):
#   • iam        — every other service calls /internal/v1/constraints
#   • content         — iam, notification, work-management need files
#   • internal-gateway         — frontend can't reach anything
#
# Disabling these is mostly safe (only specific upstream callers break):
#   • platform-data, master-data, analytics, billing-subscription, governance,
#     notification, integration, job-orchestration, work-management, workflow,
#     sso, geo, cargo, external-gateway
#
# RESOURCE BUDGET
# -----------------------------------------------------------------------------
#   First build: 30–60 min sequential (use --parallel if you have the cores).
#   Runtime RAM: ~16–24 GB for the full stack. Disable services you don't need.
#   Disk: ~10 GB for images + postgres volume.
# =============================================================================

name: onified-full

include:
  - docker-compose.local.yml
  # secret-proxy (main vault:8200, container-hostname "secret-proxy") — master-data's
  # TenantRoutingDataSource requires this actually running (SECRET_PROXY_BASE_URL:
  # http://secret-proxy:8200). Previously a separate, undocumented-in-compose
  # `-f docker-compose.secret-proxy.yml` invocation; folded in here.
  - docker-compose.secret-proxy.yml
  # vault2 + its own secret-proxy (v2/RS256, renamed "sidecar-*" to avoid
  # colliding with the "secret-proxy"/"redis" names above) + vault2-seed: the
  # sidecar stack cargo's vault-tenant DataSource depends on
  # (SECRET_PROXY_BASE_URL points at its host-mapped port, :9200). Previously
  # started as a separate `docker compose -f docker-compose.vault.yml -f
  # docker-compose.sidecar.yml up` invocation with no seeding at all — folded
  # in here so one `docker compose up` brings up the whole stack, fully
  # seeded, no manual steps.
  - docker-compose.vault.yml
  - docker-compose.sidecar.yml
  # opensearch + dashboards + otel-collector-logs. Promoted from an optional
  # `-f` overlay to infra: work-management's es-sync indexer (and platform-data's
  # outbox indexer) need a cluster to write to, so it comes up with everything
  # else. Reached in-network as http://opensearch:9200; host-mapped on 9210
  # (NOT 9200 — sidecar-secret-proxy already owns host 9200, see
  # docker-compose.sidecar.yml). docker-compose.elasticsearch.yml is the
  # Elasticsearch alternative and is intentionally NOT included — it binds the
  # same host 9200 and we standardised on OpenSearch.
  - docker-compose.opensearch.yml

# Build-time secrets — read GitLab Maven creds from your shell env.
# Same secrets get re-used by every service block below via `build.secrets`.
secrets:
  gitlab_user:
    environment: GITLAB_USER
  gitlab_token:
    environment: GITLAB_TOKEN

networks:
  default:
    name: onified-network

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # GATEWAY  (port: 8765)            tier: 4 — entry point
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Spring Cloud Gateway (reactive). Routes /api/v1/** to platform
  #             services. Owns the L2 tenant-host perimeter check.
  # Calls:      iam (token exchange + host-map), all platform services as
  #             routed downstream.
  # Called by:  frontend / external clients.
  # If commented out: front-end and external clients can't reach any service
  #                   through the routed perimeter. Every platform service does
  #                   still carry its own 127.0.0.1 host port mapping (full map
  #                   in onified-ports.md), so you can curl any of them directly
  #                   from this machine — but a direct call skips the internal-gateway's
  #                   token exchange and L2 tenant-host check, so it is a
  #                   dev/debug path only, never how the frontend talks to them.
  #                   Gateway itself is the only 0.0.0.0 (LAN-visible) binding.
  # ───────────────────────────────────────────────────────────────────────────
  internal-gateway:
    container_name: onified-internal-gateway
    image: onified/internal-gateway:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/internal-gateway/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      # Was hardcoded to "localhost:5432" — wrong inside a container (that's the
      # container itself, not the postgres one). DB_HOST below already resolves
      # correctly via the profile's own ${DB_HOST} template, so just let it.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onified_beta_local
      DB_SCHEMA: internal_gateway
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_USERNAME: postgres
      DB_PASSWORD: "Thekapilg"
      
      # platform_internal-gateway_service had zero tables (flyway.enabled=false locally,
      # same root cause as iam/content/geo before their fixes).
      SPRING_FLYWAY_ENABLED: "false"
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # ── Cross-service URLs ────────────────────────────────────────────────
      USER_SERVICE_URL: http://iam:8082
      # ── Gateway routing table (SSOT) ──────────────────────────────────────
      # application-local.yml's route URIs default to http://localhost:<port>
      # (host-bootRun mode, everything on one machine). Inside this container
      # "localhost" is the internal-gateway container itself, so every route 404/503s
      # unless overridden here to the other services' Docker Compose hostnames
      # — this block is the one place that switch happens for local Docker use.
      IDENTITY_SERVICE_URL: http://iam:8082
      CONTENT_SERVICE_URL: http://content:8081
      WORKFLOW_SERVICE_URL: http://workflow:8093
      NOTIFICATION_SERVICE_URL: http://notification:8089
      ANALYTICS_SERVICE_URL: http://analytics:8087
      SECURITY_GOVERNANCE_SERVICE_URL: http://governance:8088
      INTEGRATION_SERVICE_URL: http://integration:8090
      BILLING_SUBSCRIPTION_SERVICE_URL: http://billing-subscription:8084
      PLATFORM_DATA_SERVICE_URL: http://platform-data:8085
      MASTER_DATA_SERVICE_URL: http://master-data:8086
      CARGO_SERVICE_URL: http://cargo:8094
      JOB_ORCHESTRATION_SERVICE_URL: http://job-orchestration:8095
      WORK_MANAGEMENT_SERVICE_URL: http://work-management:8092
      GEO_SERVICE_URL: http://geo:8096
      # sso was merged into iam upstream — routes still say SSO-SERVICE-*
      # but the traffic is iam's now.
      SSO_SERVICE_URL: http://iam:8082
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      # JwtKeyProviderConfig's "iamVerifierKeyProvider" (verifies Token 1,
      # the client token iam mints) defaults to HS256 and was never told
      # iam is on RS256 here — TokenExchangeService rejected every real
      # login token with "algorithm mismatch" (iam's rbac-library 3.2.7
      # forbids HS256 entirely, so iam can ONLY issue RS256). This is
      # iam's own public key (same value as ONIFIED_RBAC_RS256_TRUSTED_
      # PUBLIC_KEYS below it uses everywhere else) — internal-gateway only verifies
      # with it, never signs.
      SECURITY_JWT_ALGORITHM: "RS256"
      SECURITY_JWT_PUBLIC_KEY: ""
      # JwtKeyProviderConfig's OTHER role — "internal-gatewaySigningKeyProvider" — signs
      # Token 3 (the internal token internal-gateway forwards to every backend service
      # after exchange). Also defaults to HS256, so workflow/master-data/etc.
      # (rbac-library 3.2.7, RS256-only) reject it: "no trusted key configured
      # for algorithm HS256". Reusing iam's own keypair here (not a
      # separate one) — every backend service already trusts this exact
      # public key via ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS.
      ONIFIED_GATEWAY_JWT_ALGORITHM: "RS256"
      ONIFIED_GATEWAY_JWT_PRIVATE_KEY: ""
      ONIFIED_GATEWAY_JWT_PUBLIC_KEY: ""
      # ── L2 tenant-host binding ────────────────────────────────────────────
      ONIFIED_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── CORS ──────────────────────────────────────────────────────────────
      # Same as application-beta.yml's onified.cors.allowed-origins: "*" —
      # explicit here so the frontend (localhost:3000 or any other dev port)
      # is never blocked, instead of relying on CorsConfig.java's implicit
      # "*" default.
      ONIFIED_CORS_ALLOWED_ORIGINS: "*"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "768m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      # Moved off 8765 — gateway-cors-proxy (nginx) now owns that port and
      # sits in front of this container. See gateway-cors-proxy's own comment
      # block (local-dev/nginx/gateway-cors-proxy.conf) for why: this
      # service's own Access-Control-* headers don't survive proxied routes
      # (Spring Cloud Gateway routing-filter behavior, unrelated to CORS
      # config values), and beta/prod never notice because an Istio Envoy
      # sidecar in front of them papers over it — local has no such sidecar.
      # 18765 is kept for direct debugging (curl/Postman bypassing the proxy).
      - "18765:8765"
    volumes:
      # ── Route-table override for the containerised stack ───────────────────
      # The in-jar application-local.yml hardcodes every route to
      # http://localhost:<port>, which is correct for host bootRun but points at
      # the GATEWAY ITSELF inside Docker — every proxied call died with
      # "Connection refused: localhost/127.0.0.1:8082" and returned 503.
      # WORKDIR is /app, and Spring Boot's file:./config/ location outranks the
      # classpath, so this file's routes list replaces the in-jar one (lists are
      # replaced, not merged). All other local-profile properties still apply.
      # Regenerate with deployment/gen-internal-gateway-routes.sh when routes change.
      - ./internal-gateway-routes-local.yml:/app/config/application-local.yml:ro
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '1.0'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # EXTERNAL-GATEWAY  (port: 8099)   tier: 4 — untrusted north-south entry point
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Spring Cloud Gateway (reactive). Client-facing entry point for
  #             external/partner API traffic — client JWT + OAuth2 client-creds
  #             validation, route registry (gw_route/gw_channel), rate limiting,
  #             quota enforcement, usage metering. Forwards to `internal-gateway` (the
  #             internal internal-gateway) after minting an internal context token.
  # Calls:      internal-gateway (downstream forwarding), governance (rate-limit policy),
  #             platform-data (sequence/business-code generation), redis, kafka.
  # Called by:  external/partner clients (not the frontend — that goes through
  #             `internal-gateway` directly).
  # If commented out: external/partner API access is unavailable. Internal
  #                   frontend traffic via `internal-gateway` is unaffected.
  # ───────────────────────────────────────────────────────────────────────────
  external-gateway:
    container_name: onified-external-gateway
    image: onified/external-gateway:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/external-gateway/Dockerfile.local-dev-jar
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=external_internal-gateway
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onified_beta_local
      DB_SCHEMA: external_internal-gateway
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_USERNAME: postgres
      DB_PASSWORD: "Thekapilg"
      SPRING_FLYWAY_ENABLED: "false"
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # ── Cross-service URLs ────────────────────────────────────────────────
      EXTERNAL_GATEWAY_INTERNAL_GATEWAY_URL: http://internal-gateway:8765
      RATE_LIMIT_GOVERNANCE_URL: http://governance:8088
      PLATFORM_DATA_SERVICE_URL: http://platform-data:8085
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_RBAC_JWT_ISSUER: onified-gateway
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "1g"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8099:8099"
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # IDENTITY  (port: 8082)           tier: 1 — foundation
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Source of truth for users, tenants, RBAC, JWT, MFA, OTP,
  #             passkey, app/route manifest. Hosts /internal/v1/constraints/
  #             fetch which every rbac-library consumer calls.
  # Calls:      content (avatar uploads).
  # Called by:  EVERY other platform service (constraint fetch, token exchange).
  # If commented out: every service that validates tokens or fetches
  #                   constraints will fail. Only safe to disable for very
  #                   narrow demos.
  # ───────────────────────────────────────────────────────────────────────────
  iam:
    container_name: onified-iam
    image: onified/iam:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/iam/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=iam
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      DB_USERNAME: postgres
      DB_PASSWORD: "Thekapilg"
      # Flyway disabled locally — the iam schema is restored from the beta dump, not built
      # from V1, so Hibernate reshapes it on boot instead (same pairing as the other
      # services' local config).
      # DB_SCHEMA is REQUIRED: application-local.yml pipes it into Hibernate's
      # default_schema as a bare ${DB_SCHEMA} with no fallback. iam is also what
      # deployment/postgres-init/02-schemas.sql pre-creates on a fresh volume.
      SPRING_FLYWAY_ENABLED: "false"
      DB_SCHEMA: iam
      SPRING_FLYWAY_SCHEMAS: iam
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      FILE_STORAGE_SERVICE_URL: http://content:8081
      # Was unset here (application-local.yml's own default is "http://localhost:8085",
      # correct for bare-metal but wrong in Docker — platform-data is a separate
      # container). MetadataCatalog/EntityRegistry/ServiceRegistry gRPC internal-gateways
      # all derive their platform-data target host from this same property, so
      # without it iam logged "Connection refused: localhost/127.0.0.1:9090"
      # on every boot (see application-local.yml's onified.s2s.grpc.targets for
      # the matching port override — this alone only fixes the host).
      PLATFORM_DATA_SERVICE_URL: http://platform-data:8085
      # gRPC server (DocumentService/EntityRegistry/etc. inbound) + s2s gRPC client targets.
      # The 4 *_SERVICE_URL/*_BASE_URL vars below feed application-local.yml's
      # onified.s2s.grpc.targets map (each internal-gateway resolves its target's HOST from these same
      # REST base-urls via GrpcTargetResolver.hostOf(...) — see EntityRegistryGrpcGateway.java
      # and siblings). Missing any one of these means that target's grpc key never resolves to
      # this compose network's service name, and the block is silently ignored (falls back to
      # dns:///localhost:9090 — a real, previously-unwired bug for content/billing/governance/
      # notification; only platform-data was wired before).
      GRPC_SERVER_PORT: "8500"
      CONTENT_SERVICE_URL: http://content:8081
      ONIFIED_BILLING_BASE_URL: http://billing-subscription:8084
      GOVERNANCE_SERVICE_URL: http://governance:8088
      ONIFIED_NOTIFICATION_BASE_URL: http://notification:8089
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # iam's cached logging-starter jar is 2026.9.3-SNAPSHOT (other services here already
      # resolved 2026.9.4-SNAPSHOT) — in 9.3 the real loggingClient bean's Kafka producer always
      # gets an empty bootstrap.servers regardless of LOGGING_SDK_BOOTSTRAP_SERVERS, crash-looping
      # iam on every boot ("No resolvable bootstrap urls given in bootstrap.servers"). dev-preview
      # mode swaps in DevPreviewLogSink (no Kafka producer at all) — the SDK's own supported
      # local-dev bypass for exactly this, not a workaround we invented.
      LOGGING_SDK_DEV_PREVIEW: "true"
      # ── Auth + crypto secrets (DEV ONLY) ──────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_CRYPTO_MASTER_KEY: "ZGV2LWFlczI1Ni1tYXN0ZXIta2V5LW5vdC1mb3ItcHJvZC0xMjM0NTY3OA=="
      ONIFIED_RBAC_JWT_ISSUER: onified-gateway
      # ── JWT signing: RS256 (DEV ONLY keypair) ─────────────────────────────
      # G12-R08/R09 forbid HS256 for issued tokens; rbac-library 3.2.7 dropped
      # HS256 verification entirely. Public key is also self-trusted here so
      # iam can verify its own RS256 tokens on its own protected endpoints.
      SECURITY_JWT_ALGORITHM: "RS256"
      SECURITY_JWT_PRIVATE_KEY: ""
      SECURITY_JWT_PUBLIC_KEY: ""
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L2 tenant-host binding ────────────────────────────────────────────
      ONIFIED_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "1g"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8500:8500"
    deploy:
      resources:
        limits:
          memory: 1.75g
          cpus: '1.5'
        reservations:
          memory: 1g
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTENT  (port: 8081)            tier: 1 — file storage
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Document + template storage. Uses Vault for per-tenant S3 creds.
  # Calls:      iam (constraint fetch), vault.
  # Called by:  iam (avatar uploads), notification (template attachments),
  #             work-management (ticket attachments), platform-data (file refs).
  # If commented out: file uploads/downloads fail. RBAC + tickets still work.
  # ───────────────────────────────────────────────────────────────────────────
  content:
    container_name: onified-content
    image: onified/content:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/content/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=content
      DB_SCHEMA: content
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=content
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: "Thekapilg"
      SPRING_FLYWAY_SCHEMAS: content
      SPRING_FLYWAY_PLACEHOLDERS_DB_SCHEMA: content
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      # Without this, DefaultAuthorityPolicyLoader falls back to its
      # http://localhost:8082 default, which inside this container resolves
      # to content's own loopback (not iam) — the policy cache warm-up
      # then fails with "Connection refused" and every @PreAuthorize check
      # denies by default (confirmed: blanket 403 ACCESS_DENIED on every
      # protected endpoint regardless of the caller's actual authorities).
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── Vault (per-tenant S3 creds) ───────────────────────────────────────
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (DocumentService inbound, called by iam/integration/
      # work-management) ─────────────────────────────────────────────────────
      GRPC_SERVER_PORT: "8501"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "768m"
    depends_on:
      postgres:   { condition: service_healthy }
      kafka:      { condition: service_healthy }
      redis:      { condition: service_healthy }
      vault-seed: { condition: service_completed_successfully }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8501:8501"
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '1.0'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # PLATFORM-DATA  (port: 8085)      tier: 1 — registries
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Table/field/service registries, Country, ApprovalActorType,
  #             OuUnitType. Outbox writer for Elasticsearch indexing.
  # Calls:      iam (constraint fetch), content (file references).
  # Called by:  workflow (approval-actor-types), analytics (source validation
  #             — commented out today), internal-gateway (routing target).
  # If commented out: workflow approval setup breaks. Most other things fine.
  # ───────────────────────────────────────────────────────────────────────────
  platform-data:
    container_name: onified-platform-data
    image: onified/platform-data:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/platform-data/Dockerfile.local-dev-jar
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=platform_data
      DB_SCHEMA: platform_data
      # SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      # Switched to Hibernate ddl-auto=update locally instead of Flyway — platform-data
      # has no RLS/tenant-isolation SQL in its migrations (verified), so this is safe
      # for this service specifically. Flyway migrations here predate a fresh-DB run
      # ever being attempted and have real bugs (V01 parser issue, already fixed
      # separately) that keep surfacing one at a time; this unblocks local dev without
      # touching beta/prod (both still use Flyway with ddl-auto=validate).
      SPRING_FLYWAY_ENABLED: "false"
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      # ServiceAccountTokenProvider.java binds this exact name — was unset before,
      # so platform-data's own S2S token mint to iam always failed.
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      FILE_STORAGE_SERVICE_URL: http://content:8081
      # Was unset — IntegrationServiceClient defaulted to http://localhost:8090, which inside
      # this container means itself, not the integration service. Broke resolveRegistry/execute
      # for the whole verification flow (pre-existing, unrelated to any single code change).
      INTEGRATION_INTERNAL_URL: http://integration:8090
      # Code default is the hyphenated "ONIFIED_PLATFORM_BETA-ADMIN", but the actual platform-scoped
      # role seeded in the beta dump (iam.role_definitions, tenant_id NULL) is spelled with an
      # underscore. Real beta deployments must override this env var too; only the local default
      # here was missing it. Without this, ServiceAccountTokenProvider can never mint a token.
      SERVICE_ACCOUNT_ROLE: ONIFIED_PLATFORM_BETA_ADMIN
      # Were unset (both defaulted to blank in application-local.yaml) — ServiceAccountTokenProvider
      # was minting a token request with username="" password="", which iam accepted once and
      # then rejected on every retry with a user_name='' unique-constraint conflict. Dev-only.
      SERVICE_ACCOUNT_USERNAME: svc_platform_data_service
      SERVICE_ACCOUNT_PASSWORD: "dev-throwaway-password"
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (EntityRegistry/ServiceRegistry/MetadataCatalog inbound) + s2s
      # client to iam (TenantIdResolverGrpcGateway, target key "iam-service").
      GRPC_SERVER_PORT: "8502"
      IDENTITY_GRPC_PORT: "8500"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      # Was missing entirely — RbacJwtUtil logged "ZERO trusted RS256 keys, ALL
      # tokens will be rejected" without it. Same key every other service trusts.
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "768m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:8502:8502"
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '1.0'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # MASTER-DATA  (port: 8086)        tier: 1 — reference data
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       59 Master* reference entities (Grade, Warehouse, Employee,
  #             Vendor, Vehicle, Position, Material, …).
  # Calls:      iam (constraint fetch), vault.
  # Called by:  workflow (master lookups), internal-gateway (routing target).
  # If commented out: workflow master-data lookups fail.
  # ───────────────────────────────────────────────────────────────────────────
  master-data:
    container_name: onified-master-data
    image: onified/master-data:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/apps/master-data/Dockerfile.local-dev-jar
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # TenantLifecycleKafkaConfig/PartnerRelationshipConsumer read
      # spring.kafka.bootstrap-servers directly (not KAFKA_BOOTSTRAP_SERVERS,
      # which nothing in master-data binds to) — without this they default to
      # localhost:9092 and the consumers never connect inside the container.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      # PlatformDataClient.java binds this exact name — was unset before, so
      # master-data's own vehicle-type lookups against platform-data always
      # fell back to localhost inside the container.
      ONIFIED_PLATFORMDATA_BASE_URL: http://platform-data:8085
      # Required so the rbac-library's AuthorityPolicyLoader bean gets created (same
      # crash class as workflow's earlier fix) — without it master-data crash-loops.
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── Vault ─────────────────────────────────────────────────────────────
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      # Required, no default — master-data's own vault-tenant secret path.
      VAULT_SECRET_PATH: "kv/master-data-service/db_cred"
      # master-data's TenantRoutingDataSource doesn't fetch DB creds from Vault
      # directly at query time — it goes through secret-proxy (vault-tenant-core's
      # SecretProxyClientImpl), which defaults to localhost:9100 (wrong inside a
      # container, and secret-proxy wasn't even running). Confirmed via a real
      # 500 on POST /api/v1/master/customers: "ProxyUnavailableException:
      # secret-proxy I/O failure after retries". Requires the secret-proxy
      # overlay (docker-compose.secret-proxy.yml) to actually be running.
      # Port 8200 is secret-proxy's real HTTP/REST API — its OWN 8201 is a
      # separate raw TCP tunnel (confirmed via its own boot log), not HTTP;
      # pointing here first got "parsing HTTP/1.1 status line" garbage-byte
      # errors, not a clean connection failure.
      SECRET_PROXY_BASE_URL: http://secret-proxy:8200
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s client to billing-subscription
      # (EntitlementGrpcGateway, target key "billing-subscription-service").
      GRPC_SERVER_PORT: "8508"
      BILLING_GRPC_PORT: "8503"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      # Required directly by rbac-library's PartnerRelationshipConsumer (raw @Value on the env var
      # name itself, no property-path default) — without it master-data crash-loops on boot.
      # Same dev-only value as application.yml's (base) internal-jwt-secret default.
      ONIFIED_RBAC_INTERNAL_JWT_SECRET: "ad5581d9fb20ed04a3f5a9f4eeb9f6e99cfca9e838742b230e1ee159935ed538"
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      HEAP: "768m"
      # ── Schema management ─────────────────────────────────────────────────
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:   { condition: service_healthy }
      kafka:      { condition: service_healthy }
      redis:      { condition: service_healthy }
      vault-seed: { condition: service_completed_successfully }
      secret-proxy: { condition: service_started }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8086:8086"
      - "127.0.0.1:8508:8508"
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '1.0'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default
  # ═══════════════════════════════════════════════════════════════════════════
  # ANALYTICS  (port: 8087)          tier: 2 — analytics
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Pure PostgreSQL analytics dashboards + Redis pub/sub for

  #             cache invalidation. No Kafka consumers.
  # Calls:      iam (commented out today — source validation disabled),
  #             platform-data (commented out today).
  # Called by:  internal-gateway (routing target).
  # If commented out: analytics dashboards unavailable. Nothing else breaks.
  # ───────────────────────────────────────────────────────────────────────────
  analytics:
    container_name: onified-analytics
    image: onified/analytics:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/analytics/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=analytics
      DB_SCHEMA: analytics
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      # Fresh local volume has no schema; loc\l yml disables flyway assuming a
      # beta dump was restored (same fix already applied to internal-gateway/iam/content/geo).
      SPRING_FLYWAY_ENABLED: "false"
      
      # Required so the rbac-library's AuthorityPolicyLoader bean gets created (same
      # crash class as workflow/master-data's earlier fix) — without it, crash-loops.
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      # ── Kafka / Redis (Redis is the primary integration here) ─────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # SPRING_DATA_REDIS_HOST/PORT above are dead — analytics' own yml wrapsone n
      # spring.data.redis.host/port in a NESTED ${REDIS_HOST:localhost} 
      # ${REDIS_PORT:6379} placeholder, so only these exact names are read.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s client to billing-subscription
      # (EntitlementGrpcGateway, target key "billing-subscription-service").
      GRPC_SERVER_PORT: "8509"
      BILLING_GRPC_PORT: "8503"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Heap override (matches Dockerfile default) ────────────────────────
      # Prod defaults to 8g for large analytical scans; reduced here for local dev.
      HEAP: "768m"
      # Overrides the Dockerfile's baked-in JAVA_OPTS (env var wins over image ENV
      # default) — identical except -XX:+AlwaysPreTouch -> -XX:-AlwaysPreTouch.
      # AlwaysPreTouch forces the JVM to commit its ENTIRE heap synchronously at
      # startup instead of growing into it lazily; on a host this memory-tight,
      # that upfront all-or-nothing demand is what's actually triggering the
      # OOM kill within seconds, before the app logs a single line.
      JAVA_OPTS: >-
        -server
        -Xms768m -Xmx768m
        -XX:-AlwaysPreTouch
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=80.0
        -XX:MaxRAMPercentage=80.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:InitiatingHeapOccupancyPercent=35
        -XX:+UseStringDeduplication
        -XX:+ParallelRefProcEnabled
        -XX:MetaspaceSize=128m
        -XX:MaxMetaspaceSize=512m
        -XX:CompressedClassSpaceSize=128m
        -XX:MaxDirectMemorySize=512m
        -XX:ReservedCodeCacheSize=256m
        -XX:+UseCodeCacheFlushing
        -Xss512k
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/log/heapdumps/
        -XX:ErrorFile=/var/log/jvm/hs_err_pid%p.log
        -Djava.net.preferIPv4Stack=true
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
        -Dspring.jmx.enabled=false
        -Djava.security.egd=file:/dev/./urandom
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8087:8087"
      - "127.0.0.1:8509:8509"
    # Uncapping this entirely (tried once) let the container try to grab memory
    # the host doesn't have, and destabilized Docker's engine itself rather than
    # helping analytics boot. Reverted to a bounded, generous limit.
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: '1.0'
        reservations:
          memory: 1.5g
          cpus: '0.25'
    networks:
      - default

