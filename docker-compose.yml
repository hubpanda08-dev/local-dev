  # ═══════════════════════════════════════════════════════════════════════════
  # GEO  (port: 8096)                tier: 3 — geofence + live location
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Geofence policies, live location/trip tracking via WebSocket,
  #             14+ Kafka producers (geo events / alerts / signals), consent
  #             enforcement, signal-spoofing detection.
  # Calls:      iam (constraint fetch), master-data (kafka consumer for
  #             geofence.master.changed.v1).
  # Called by:  internal-gateway (routing target), cargo (location lookups), frontend
  #             (WebSocket /ws/geo).
  # If commented out: live location, geofence enforcement, and cargo trip
  #                   tracking break. Other services continue.
  # ───────────────────────────────────────────────────────────────────────────
  geo:
    container_name: onified-geo
    image: onified/geo:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform/geo/Dockerfile.local-dev
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      # currentSchema fully REPLACES the JDBC session's search_path (it does not prepend/append) —
      # "geolocation" alone drops "public", where the postgis extension's functions live, so every
      # native query calling ST_MakePoint/ST_Covers/etc (geofence resolve, master route recompute)
      # failed with "function st_makepoint(...) does not exist". Must list both schemas.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=geolocation,public
      DB_SCHEMA: geolocation
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Thekapilg"
      # Reverted to Flyway — geo has PostGIS geometry columns Hibernate's ddl-auto
      # cannot generate DDL for at all (hard limitation, not just inconvenience).
      # The one missing table (event_outbox) is added directly via SQL instead.
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/onified_beta_local?currentSchema=geolocation
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: "Thekapilg"
      SPRING_FLYWAY_SCHEMAS: geolocation
      SPRING_FLYWAY_PLACEHOLDERS_DB_SCHEMA: geolocation
      # LOCATIONS override is REQUIRED and was missing: base application.yml
      # points at classpath:db/migration/local, which does not exist on disk —
      # geo's 27 migrations live in db/migration. failOnMissingLocations
      # defaults to false, so ENABLED=true alone applied ZERO migrations and
      # only created flyway_schema_history, silently leaving platform_geo empty.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      IDENTITY_BASE_URL: http://iam:8082
      MASTER_DATA_SERVICE_URL: http://master-data:8086
      # MASTER_DATA_SERVICE_URL above doesn't match the property geo's own
      # MasterDataClient actually binds to (onified.masterdata.base-url) — the real one:
      MASTERDATA_SERVICE_URL: http://master-data:8086
      # Same class of bug as MASTERDATA_SERVICE_URL above: PlatformDataSequenceClient's REST
      # fallback binds to onified.platformdata.base-url, driven by PLATFORM_DATA_BASE_URL — this
      # var was missing entirely, so it defaulted to http://localhost:8085 (geo's OWN container,
      # not platform-data's), and every sequence issuance that fell back to REST (after a gRPC
      # timeout) failed with connection refused -> GEO.SEQUENCE_GENERATION_FAILED on every create.
      PLATFORM_DATA_BASE_URL: http://platform-data:8085
      # Same AuthorityPolicyLoader crash as workflow/billing-subscription.
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      # ── RS256 JWT verification (DEV ONLY) ─────────────────────────────────
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # java-logging-sdk 4.0.3 DataResidencyGuard (G13 S11) rejects the local
      # broker hostname 'kafka' as not looking like an India-region address.
      LOGGING_SDK_ENFORCE_DATA_RESIDENCY: "false"
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s client to governance
      # (MonitoringPolicyGrpcGateway, target key "governance-service").
      GRPC_SERVER_PORT: "8510"
      GOVERNANCE_GRPC_PORT: "8504"
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      HEAP: "768m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8096:8096"
      - "127.0.0.1:8510:8510"
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '0.75'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default

  # ═══════════════════════════════════════════════════════════════════════════
  # CARGO  (port: 8094)              tier: app — freight/logistics orchestration
  # ═══════════════════════════════════════════════════════════════════════════
  # Role:       Shipments, trips, carriers, drivers, finance (invoices/payments/
  #             settlements), fleet, sub-broker, real-time tracking. 73 REST
  #             controllers, 76 entities, outbox+saga pattern.
  # Calls:      iam (S2S token + partner lookup), master-data (kafka
  #             consumers for driver/vehicle/customer/route changes), geo
  #             (location lookups), work-management (SLA timers), billing
  #             (invoice/payment reconciliation), content (PoD evidence).
  # Called by:  internal-gateway (routing target), driver mobile app (DriverMobileController).
  # If commented out: cargo/logistics domain entirely unavailable. Platform
  #                   services unaffected (cargo is apps-tier).
  # Note:       Native port is 8082 (collides with iam). SERVER_PORT
  #             overrides to 8094 inside the container so external and
  #             internal ports align.
  # ───────────────────────────────────────────────────────────────────────────
  cargo:
    container_name: onified-cargo
    image: onified/cargo:dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/apps/cargo/Dockerfile.local-dev-jar
      secrets:
        - source: gitlab_user
        - source: gitlab_token
    environment:
      # ── Profile + DB ──────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onified_beta_local
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Thekapilg
      # Port override — native 8082 collides with iam.
      SERVER_PORT: "8094"
      # ── Kafka / Redis ─────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # ── Cross-service URLs ────────────────────────────────────────────────
      ONIFIED_RBAC_CONSTRAINT_FETCH_URL: http://iam:8082/internal/v1/constraints/fetch
      ONIFIED_RBAC_USER_MANAGEMENT_URL: http://iam:8082
      IDENTITY_BASE_URL: http://iam:8082
      MASTER_DATA_SERVICE_URL: http://master-data:8086
      WORK_MANAGEMENT_BASE_URL: http://work-management:8092
      BILLING_SERVICE_URL: http://billing-subscription:8084
      CONTENT_SERVICE_URL: http://content:8081
      GEO_SERVICE_URL: http://geo:8096
      # None of the 6 vars above match what cargo's own @ConfigurationProperties
      # classes actually bind to (all prefixed "cargo.<service>.base-url") — the
      # real ones, confirmed against cargo's own config source:
      CARGO_IDENTITY_BASE_URL: http://iam:8082
      CARGO_MASTERDATA_BASE_URL: http://master-data:8086
      CARGO_SLA_BASE_URL: http://work-management:8092
      CARGO_BILLING_BASE_URL: http://billing-subscription:8084
      CARGO_CONTENT_BASE_URL: http://content:8081
      CARGO_GEO_BASE_URL: http://geo:8096
      # Not set at all before (cargo.integration/cargo.platform-data properties):
      CARGO_INTEGRATION_BASE_URL: http://integration:8090
      CARGO_PLATFORM_DATA_BASE_URL: http://platform-data:8085
      # cargo's vault-tenant-routing DataSource (same class of hard-wired
      # dependency as master-data) needs its own secret-proxy — but a
      # DIFFERENT instance from master-data's: the "sidecar" one
      # (docker-compose.sidecar.yml + docker-compose.vault.yml), which
      # backs onto vault2/9100, not the main vault:8200. It's on its own
      # docker network (file-storage-net), reached here via the host port
      # it maps out (9200), not a container hostname.
      SECRET_PROXY_BASE_URL: http://host.docker.internal:9200
      # ── Logging SDK ───────────────────────────────────────────────────────
      LOGGING_SDK_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_SDK_OTEL_ENABLED: "false"
      # ── gRPC server (inbound) + s2s client to iam
      # (RelationshipSharedResourceGrpcGateway / TenantPartnerRelationshipGrpcGateway,
      # target key "iam-service").
      GRPC_SERVER_PORT: "8511"
      IDENTITY_GRPC_PORT: "8500"
      # ── Auth secrets (DEV ONLY) ───────────────────────────────────────────
      ONIFIED_JWT_SECRET_KEY: "ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1kby1ub3QtdXNlLTMyYnl0ZXM="
      ONIFIED_RBAC_TOKEN_SECRET: "ZGV2LXJiYWMtdG9rZW4tc2VjcmV0LTMyLWJ5dGVzISE="
      # cargo's config has no default for this (unlike workflow/iam) — same
      # dev-only value dev-env.sh already uses for local bootRun.
      ONIFIED_RBAC_INTERNAL_JWT_SECRET: "ad5581d9fb20ed04a3f5a9f4eeb9f6e99cfca9e838742b230e1ee159935ed538"
      # ── RS256 JWT verification (DEV ONLY) ─────────────────────────────────
      # trust iam's signing key so login-minted tokens validate here too.
      ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS: ""
      # cargo's base application.yml (no local override) lists /api/** as a public
      # path — that bypasses RbacJwtAuthFilter entirely for every real cargo endpoint,
      # so no Authentication ever lands in SecurityContext and TenantContextAccessor
      # sees nothing → "Tenant context is required" even with a perfectly valid token.
      # Source fixed (removed the line) but that needs a rebuild; this env var
      # override achieves the same corrected list without one — matches beta/prod's
      # own lists, which never had /api/** either.
      ONIFIED_RBAC_PUBLIC_PATHS_PATTERNS: "/swagger-ui/**,/cargo-service/swagger-ui/**,/v3/api-docs/**,/cargo-service/v3/api-docs/**,/swagger-ui.html,/cargo-service/swagger-ui.html,/actuator/**,/cargo-service/actuator/**,/public/v1/trip/**,/internal/v1/**"
      # ── L4 tenant-host binding ────────────────────────────────────────────
      ONIFIED_RBAC_TENANT_HOST_BINDING_ENFORCE: "false"
      # ── Service identity (CrossTenantExecutor: own-tenant + partner-tenant DB-credential
      # tokens for RFQ/award/own-truck flows) — every tenant switch calls iam's legacy
      # /internal/v1/service-auth/token-for-(own-)tenant path, which auto-provisions this
      # UserAccounts row on first use (findOrCreateServiceUser) and just needs a REAL role
      # publicId. "CARGO_SERVICE" (rol_4e3b51f400f0410eb9f9536fa4affb6c) already exists in the
      # restored beta dump, platform-scoped (tenant_id NULL) so it resolves for any tenant.
      # Without these, every CrossTenantExecutor call gets rawJwt=null -> "rawJwt required".
      ONIFIED_RBAC_SERVICE_IDENTITY_ENABLED: "true"
      ONIFIED_RBAC_SERVICE_IDENTITY_USERNAME: "svc_cargo_service"
      ONIFIED_RBAC_SERVICE_IDENTITY_PASSWORD: "dev-throwaway-password"
      ONIFIED_RBAC_SERVICE_IDENTITY_ROLE_ID: "rol_4e3b51f400f0410eb9f9536fa4affb6c"
      # ── Heap override — minimized for a low-resource local run ────────────
      HEAP: "768m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      # vault2-seed populates the "localtest-kv/db_cred" secret cargo's
      # vault-tenant DataSource fetches through the sidecar secret-proxy —
      # without it, cargo boots but every tenant-scoped query/migration fails.
      vault2-seed: { condition: service_completed_successfully }
      # SECRET_PROXY_BASE_URL above points at this container's host-mapped
      # port (9200) — it's a separate overlay service, not pulled in by
      # vault2-seed alone. Without this, `docker compose up cargo` never
      # starts it and every tenant-scoped query fails silently.
      sidecar-secret-proxy: { condition: service_started }
    # Host port mapping (see onified-ports.md). Bound to 127.0.0.1 so the
    # service is reachable from this machine for dev/curl but is NOT
    # published to the LAN — every block below carries dev-only secrets and
    # no direct-access auth perimeter. Normal traffic still goes via internal-gateway.
    ports:
      - "127.0.0.1:8094:8094"
      - "127.0.0.1:8511:8511"
    deploy:
      resources:
        limits:
          memory: 1.25g
          cpus: '1.0'
        reservations:
          memory: 768m
          cpus: '0.25'
    networks:
      - default
