# Local-dev-only stand-in for beta/prod's Istio/Envoy sidecar.
#
# Root cause (see local-dev debugging session): Spring Cloud Gateway's own
# CorsWebFilter (services/platform/internal-gateway .../config/CorsConfig.java)
# writes Access-Control-* headers correctly for the gateway's OWN endpoints
# (actuator, EAG), but for any PROXIED route those headers are lost when
# Spring Cloud Gateway's routing filters merge the downstream response's
# headers into the exchange — verified via curl + TRACE logs: even a plain
# proxied 404 with no app-specific filters loses the header, while
# non-proxied endpoints keep it.
#
# In beta/prod this never surfaces because the gateway pod sits behind an
# Istio Envoy sidecar (confirmed via `server: istio-envoy` on the beta
# response) that ends up being the thing actually emitting the single clean
# Access-Control-Allow-Origin — that infra lives outside this repo, in the
# cluster's Istio config, not in any file here. Local Docker Compose has no
# such sidecar, so this container fills that specific gap for local dev only.
#
# Listens on the port the frontend actually calls (8765) and proxies straight
# through to internal-gateway, which now binds to 18765 instead (see
# docker-compose.yml). Strips whatever Access-Control-*/Vary the gateway did
# or didn't set, and writes one canonical set — mirrors CorsConfig.java's
# allowed-origins: "*" for local (onified.cors.allowed-origins in
# application-local.yml), reflecting the request Origin since credentials
# are involved.

server {
    listen 8765;

    # This container lives in the infra compose file (docker-compose.local.yml) and comes
    # up independent of internal-gateway's own lifecycle — no depends_on between them. A
    # bare `proxy_pass http://internal-gateway:8765` resolves the hostname once at config
    # load and fails nginx startup outright if internal-gateway's container doesn't exist
    # yet. Routing proxy_pass through a variable defers DNS lookup to request time instead
    # (via Docker's embedded resolver), so this starts fine before/without/independent of
    # internal-gateway and just 502s per-request until it's up, same as any reverse proxy.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://internal-gateway:8765;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket upgrade support (chat/notification routes use it via this gateway).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Discard whatever the upstream did or didn't set for these — see comment above.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;

        add_header Vary Origin always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
        # No Access-Control-Allow-Headers here — meaningless on a non-preflight response
        # (only the OPTIONS preflight below is ever checked against it), and a literal "*"
        # is invalid once Allow-Credentials is true anyway (see the OPTIONS block's note).
        add_header Access-Control-Expose-Headers "Authorization, Content-Type, X-Total-Count, X-Page-Number, X-Page-Size, X-Request-Id, X-Correlation-ID, X-Trace-Id, X-Entity-Registry-Public-Id" always;

        if ($request_method = OPTIONS) {
            add_header Vary Origin always;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            # Literal "*" is invalid here once Allow-Credentials is true (Fetch spec forbids
            # the wildcard token under credentialed mode, unlike Allow-Origin) — reflect
            # whatever the browser actually asked for instead, same as Spring's
            # CorsConfiguration.setAllowedHeaders(List.of("*")) already does under the hood.
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0;
            return 204;
        }
    }
}
