# =============================================================================
# Optional Elasticsearch overlay.
#
# Required by platform-data (outbox-driven ES indexer). Bring up alongside
# the main stack:
#
#   docker compose \
#     -f deployment/docker-compose.local.yml \
#     -f deployment/docker-compose.elasticsearch.yml \
#     up -d
#
# Or with the full services compose:
#
#   docker compose \
#     -f deployment/docker-compose.yml \
#     -f deployment/docker-compose.elasticsearch.yml \
#     up -d
#
# Extracted from the former services/platform/platform-data/docker-compose.yml
# so that ES lives with the rest of the infra and joins the shared
# `onified-network`.
# =============================================================================


services:
  elasticsearch:
    image: elasticsearch:8.17.3
    container_name: onified-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: "changeme"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:changeme http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - default

volumes:
  es-data:

networks:
  default:
    name: onified-network
    external: true
