      context: ..
      dockerfile: services/platform/governance/Dockerfile.local-dev-jar

  notification:
    build:
      context: ..
      dockerfile: services/platform/notification/Dockerfile.local-dev-jar

  integration:
    build:
      context: ..
      dockerfile: services/platform/integration/Dockerfile.local-dev-jar

  job-orchestration:
    build:
