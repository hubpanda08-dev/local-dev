# =============================================================================
# Optional Vault secret-proxy overlay.
#
# Required by integration (per-tenant Vault credential routing via tenantKey
# JWT claim). Bring up alongside the main stack:
#
#   docker compose \
#     -f deployment/docker-compose.local.yml \
#     -f deployment/docker-compose.secret-proxy.yml \
#     up -d
#
# Or with the full services compose:
#
#   docker compose \
#     -f deployment/docker-compose.yml \
#     -f deployment/docker-compose.secret-proxy.yml \
#     up -d
#
# Extracted from the former services/platform/integration/docker-compose.yml.
# Depends on `vault` + `redis` from docker-compose.local.yml.
# Listens on 8200/8201 — the same ports Vault uses. To avoid conflict, this
# overlay re-binds Vault to a sidecar named `vault-direct` is NOT done here;
# you must stop the bundled `vault` container first if running the proxy:
#
#   docker stop onified-vault
#   docker compose -f ... -f docker-compose.secret-proxy.yml up -d
#
# Or change one of the port mappings if you need both running simultaneously.
# =============================================================================

services:
  secret-proxy:
    # v2 supports RS256 (v1/"latest" was HS256-only) — verified 2026-08-01: loads
    # ONIFIED_GATEWAY_JWT_PUBLIC_KEY/ONIFIED_IDENTITY_JWT_PUBLIC_KEY, validates a
    # real gateway-issued RS256 token, and returns real Vault data end-to-end.
    # NOTE: v2 expects a per-tenant Vault mount named "{tenantKey}-kv" (e.g.
    # "localtest-kv"), not the single shared "kv" mount vault-seed creates today —
    # re-seed under that mount name for each tenant before relying on this.
    image: vdtj/secret-proxy:v2
    container_name: onified-secret-proxy
    restart: unless-stopped
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_TLS_VERIFY: "false"
      REDIS_ADDR: redis:6379
      REDIS_ENABLED: "true"
      JWT_CLAIM: tenantKey
      JWT_ALGORITHM: RS256
      # v2 needs the FULL PEM (headers + newlines) — unlike rbac-library's
      # ONIFIED_RBAC_RS256_TRUSTED_PUBLIC_KEYS elsewhere, which takes bare base64.
      ONIFIED_GATEWAY_JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2bKXEiiD+/qZrfMRJUGV\nsnj/5mBLr+gdJZpmVJ4XqDaYx7i59V9EMWN+DvzAa08QaCgGbfGTQCVI6Kxjl1cr\n7GPPIp0XzmZJ6vAbnkXZBEiyfwDXo7a4EnOGzi0B493zyYru/CNbdMvS4LjNmkrU\nxb32zbVHhX4Zn51Ml0Uivk36sBIyamNAAIrPzG3LgdR1qbZzqc+fWDnuAEIzYhC+\nEmIGimC+eOgM4NztK9U/7fqaF0VDgxXq1R4srx4pimp3AabdiwkNdYEslOc7gY+3\nz5+XAKfakP7yrWP6n5hdceV53fwCakF9gLq8u9adfBkZfgMQU285dhvBMWz0zgcw\nkwIDAQAB\n-----END PUBLIC KEY-----\n"
      ONIFIED_IDENTITY_JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2bKXEiiD+/qZrfMRJUGV\nsnj/5mBLr+gdJZpmVJ4XqDaYx7i59V9EMWN+DvzAa08QaCgGbfGTQCVI6Kxjl1cr\n7GPPIp0XzmZJ6vAbnkXZBEiyfwDXo7a4EnOGzi0B493zyYru/CNbdMvS4LjNmkrU\nxb32zbVHhX4Zn51Ml0Uivk36sBIyamNAAIrPzG3LgdR1qbZzqc+fWDnuAEIzYhC+\nEmIGimC+eOgM4NztK9U/7fqaF0VDgxXq1R4srx4pimp3AabdiwkNdYEslOc7gY+3\nz5+XAKfakP7yrWP6n5hdceV53fwCakF9gLq8u9adfBkZfgMQU285dhvBMWz0zgcw\nkwIDAQAB\n-----END PUBLIC KEY-----\n"
    depends_on:
      vault:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8201:8201"
    networks:
      - default

networks:
  # NOT external: this file is pulled in via `include:` from docker-compose.yml,
  # which owns/creates onified-network. Marking it external here made every
  # `docker compose up` fail before the network was ever created. Only mark it
  # external again if this overlay goes back to being run standalone with -f
  # against an already-running stack.
  default:
    name: onified-network
